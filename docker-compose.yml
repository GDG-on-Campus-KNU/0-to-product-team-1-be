services:
  db:
    image: postgres:15
    container_name: gdg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gdg_db
      POSTGRES_USER: gdg_user
      POSTGRES_PASSWORD: gdg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdg_user -d gdg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gdg-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ai
      dockerfile: ml_service/Dockerfile
    container_name: stepback-ml
    ports:
      - "8001:8001"
    environment:
      PYTHONIOENCODING: utf-8
      FORCE_MOCK: ${FORCE_MOCK:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUDIT_SALT: ${AUDIT_SALT:-replace_me_with_32_plus_random_hex_chars}
      PORT: 8001
    volumes:
      - ./ai/w1:/srv/w1:ro
      - ./ai/logs:/logs
      - ./ai/ml_service/data:/srv/ml_service/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: gdg-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gdg_db
      SPRING_DATASOURCE_USERNAME: gdg_user
      SPRING_DATASOURCE_PASSWORD: gdg_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
