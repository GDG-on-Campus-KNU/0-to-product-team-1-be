version: '3.8'
services:
  db:
    image: postgres:15
    container_name: gdg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gdg_db
      POSTGRES_USER: gdg_user
      POSTGRES_PASSWORD: gdg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
