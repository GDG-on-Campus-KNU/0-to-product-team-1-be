version: '3.8'
services:
  db:
    image: postgres:15
    container_name: gdg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gdg_db
      POSTGRES_USER: gdg_user
      POSTGRES_PASSWORD: gdg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gdg-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: gdg-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gdg_db
      SPRING_DATASOURCE_USERNAME: gdg_user
      SPRING_DATASOURCE_PASSWORD: gdg_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ML_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
