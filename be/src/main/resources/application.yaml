spring:
  application:
    name: backend

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    timeout: 30000
    timeout-label: 5000
    timeout-recommend: 3000
    timeout-weekly: 5000
    timeout-health: 3000
    retry-max-attempts: 2

admin:
  token: ${ADMIN_TOKEN:dev_token_local}

jwt:
  secret: ${JWT_SECRET:mysecretkeyformysecretkeyformysecretkeyfor}
