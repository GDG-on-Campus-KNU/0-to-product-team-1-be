spring:
  application:
    name: backend

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    timeout: 10000
