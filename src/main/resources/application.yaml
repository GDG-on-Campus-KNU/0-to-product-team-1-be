spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/gdg_db
    username: gdg_user
    password: gdg_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
